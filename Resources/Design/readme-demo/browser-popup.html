<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MacIDM — popup preview</title>
<link rel="stylesheet" href="demo-kit.css">
<style>
  html, body { background: #fff; }
  .stage { width: 380px; height: 470px; background: #fff; padding: 12px 14px; }
  header { display: flex; align-items: center; gap: 8px; }
  header img { width: 26px; height: 26px; border-radius: 6px; }
  header b { font-size: 15px; }
  .pill { padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
  .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  .more { color: #888; letter-spacing: 1px; }
  .section { display: flex; justify-content: space-between; margin: 12px 2px 4px; color: var(--text-secondary); font-weight: 600; font-size: 12px; }
  .section span:last-child { font-weight: 400; }
  .hint { padding: 10px 2px; color: var(--text-secondary); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(91,108,240,.25); border-top-color: var(--accent); }
  .item { padding: 8px 6px; border-radius: 7px; display: flex; align-items: center; gap: 8px; }
  .item.hover { background: rgba(91, 108, 240, 0.08); }
  .item .name { font-weight: 600; }
  .item .meta { margin-top: 2px; color: var(--text-secondary); font-size: 12px; display: flex; gap: 5px; align-items: center; }
  .item .chev { margin-left: auto; color: #999; }
  .badge { padding: 0 5px; border-radius: 4px; font-size: 10px; font-weight: 700; background: rgba(56, 171, 120, 0.14); color: var(--success); }
  .variants { margin: 2px 6px 6px 6px; border: 1px solid var(--separator); border-radius: 8px; overflow: hidden; }
  .variant { display: flex; justify-content: space-between; padding: 7px 10px; font-size: 12px; }
  .variant + .variant { border-top: 1px solid var(--separator); }
  .variant.selected { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .variants .actions { padding: 8px 10px; border-top: 1px solid var(--separator); display: flex; justify-content: flex-end; }
  .label { font-size: 12px; color: var(--text-secondary); margin: 10px 2px 2px; font-weight: 600; }
  .all { margin-top: 12px; width: 100%; height: 32px; }
  .toast { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); padding: 7px 12px; border-radius: 8px; background: rgba(30,30,32,.9); color: #fff; font-size: 12px; white-space: nowrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <header>
    <img src="../../../BrowserExtension/chrome/icons/icon-128.png" alt="">
    <b>MacIDM</b>
    <span class="pill" data-t="authorize"></span>
    <span class="dot"></span><span class="more">···</span>
  </header>

  <div class="section"><span data-t="pageMedia"></span><span id="count"></span></div>
  <div class="hint" id="hint"><span class="spinner"></span><span data-t="listening"></span></div>

  <div class="item" id="mp4">
    <div>
      <div class="name">Sintel — trailer</div>
      <div class="meta"><span class="film"></span>MP4 · 4.4 MB · 00:52</div>
    </div>
    <span class="chev">›</span>
  </div>
  <div class="item" id="hls">
    <div>
      <div class="name">Sintel — trailer <span class="badge">HLS</span></div>
      <div class="meta"><span class="film"></span><span data-t="hlsMeta"></span></div>
    </div>
    <span class="chev" id="hlsChev">›</span>
  </div>
  <div class="variants" id="variants">
    <div class="variant selected" id="v1080"><span>1080p · H.264</span><span>≈ 168 MB</span></div>
    <div class="variant"><span>720p · H.264</span><span>≈ 92 MB</span></div>
    <div class="variant"><span>480p · H.264</span><span>≈ 48 MB</span></div>
    <div class="actions"><span class="btn primary" id="download" data-t="download"></span></div>
  </div>

  <div id="images">
    <div class="label" data-t="images"></div>
    <div class="item">
      <div>
        <div class="name">poster.jpg</div>
        <div class="meta">JPG · 182 KB</div>
      </div>
      <span class="chev">›</span>
    </div>
  </div>

  <span class="btn all" data-t="downloadAll"></span>
  <div class="toast" id="toast" data-t="sent"></div>
</div>

<script type="module">
import { applyStrings, cursorPath, drawCursor, easeOut, registerScene, span, tr } from "./demo-kit.js";

// Strings mirror BrowserExtension/chrome/src/shared/locale-*.js (popup.*).
applyStrings({
  authorize: { en: "Authorize cookies", zh: "授权 Cookie" },
  pageMedia: { en: "Media on this page", zh: "本页媒体" },
  listening: {
    en: "Listening for media requests; play a video and this list will update automatically.",
    zh: "正在监听媒体请求；播放视频后这里会自动更新。",
  },
  hlsMeta: { en: "HLS · 3 qualities · 00:52", zh: "HLS · 3 种画质 · 00:52" },
  images: { en: "Images (1)", zh: "图片 (1)" },
  download: { en: "Download", zh: "点击下载" },
  downloadAll: { en: "Download all links on this page", zh: "下载本页全部链接" },
  sent: { en: "Sent to MacIDM", zh: "已发送给 MacIDM" },
});

const film =
  '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1.5" width="10" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M3.5 1.5v9M8.5 1.5v9M1 4.5h2.5M1 7.5h2.5M8.5 4.5H11M8.5 7.5H11" stroke="currentColor" stroke-width="1"/></svg>';
for (const node of document.querySelectorAll(".film")) node.innerHTML = film;

const $ = (id) => document.getElementById(id);
const counts = { en: (n) => (n === 1 ? "1 resource" : `${n} resources`), zh: (n) => `${n} 个资源` };

const cursorKeys = [
  { t: 0, x: 330, y: 440 },
  { t: 3.2, x: 330, y: 440 },
  { t: 4.0, x: 250, y: 152 },
  { t: 5.2, x: 250, y: 152 },
  { t: 6.0, x: 318, y: 294 },
  { t: 9.0, x: 318, y: 294 },
];
const clicks = [4.3, 6.3];

function reveal(node, amount) {
  node.hidden = amount <= 0.001;
  node.style.opacity = String(amount);
  node.style.transform = `translateY(${(1 - amount) * 6}px)`;
}

function render(t) {
  const shown = (t >= 1.0) + (t >= 1.8) + (t >= 2.6);
  $("count").textContent = shown ? tr(counts)(shown) : "";
  $("hint").hidden = t >= 1.0;
  reveal($("mp4"), easeOut(span(t, 1.0, 1.3)));
  reveal($("hls"), easeOut(span(t, 1.8, 2.1)));
  reveal($("images"), easeOut(span(t, 2.6, 2.9)));
  $("hls").classList.toggle("hover", t > 3.8 && t < 6.6);
  reveal($("variants"), easeOut(span(t, 4.35, 4.6)) * (1 - span(t, 7.0, 7.3)));
  $("hlsChev").textContent = t > 4.35 && t < 7.0 ? "⌄" : "›";
  $("download").classList.toggle("pressed", t > 6.25 && t < 6.55);
  const toast = $("toast");
  toast.style.opacity = String(span(t, 6.5, 6.7) * (1 - span(t, 8.2, 8.5)));
  drawCursor(cursorPath(cursorKeys, t), t, clicks, t < 8.6);
}

registerScene({ duration: 9, fps: 10, width: 380, height: 470, render });
</script>
</body>
</html>
