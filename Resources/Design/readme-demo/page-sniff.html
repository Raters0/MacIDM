<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MacIDM — page sniff preview</title>
<link rel="stylesheet" href="demo-kit.css">
<style>
  .stage { width: 1024px; height: 720px; background: var(--page); }

  /* Web page with the video. */
  .page { position: absolute; inset: 0; padding: 34px 72px; transition: none; }
  .page h1 { margin: 0 0 14px; font-size: 20px; font-weight: 600; }
  .video {
    position: relative;
    width: 880px;
    height: 495px;
    border-radius: 4px;
    background: #000 url("sintel-poster.jpg") center / cover;
  }
  .controls {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 46px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: #fff;
    font-size: 12px;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.55));
  }
  .controls .track { flex: 1; height: 3px; background: rgba(255, 255, 255, 0.35); border-radius: 2px; }
  .controls .track i { display: block; width: 23%; height: 100%; background: #fff; border-radius: 2px; }
  .caption { margin-top: 14px; font-size: 13px; color: #444; }
  .caption u { text-underline-offset: 2px; }

  /* MacIDM floating button (collapsed) and its panel. */
  .fab {
    position: absolute;
    left: 920px; top: 46px;
    width: 30px; height: 30px;
    border-radius: 7px;
    background: #fff;
    box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.18);
    display: grid; place-items: center;
    color: #555;
  }
  .fab.hover { color: var(--accent); }
  .panel {
    position: absolute;
    left: 560px; top: 84px;
    width: 392px;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.14), 0 10px 30px rgba(0, 0, 0, 0.2);
    overflow: hidden;
    transform-origin: 380px 0;
  }
  .panel header {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--separator);
    font-weight: 600;
  }
  .panel header .count { color: var(--text-tertiary); font-weight: 400; }
  .panel header .cookie { margin-left: auto; color: var(--accent); font-size: 12px; font-weight: 400; }
  .panel header .close { color: #777; font-weight: 400; font-size: 15px; }
  .row { display: flex; align-items: center; padding: 11px 14px; gap: 10px; }
  .row.hover { background: rgba(91, 108, 240, 0.07); }
  .row .name { font-weight: 600; }
  .row .meta { margin-top: 3px; color: var(--text-secondary); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .row .chevron { margin-left: auto; color: #aaa; }
  .toast {
    position: absolute; left: 600px; top: 166px;
    padding: 7px 12px; border-radius: 8px;
    background: rgba(30, 30, 32, 0.9); color: #fff; font-size: 12px;
  }

  /* MacIDM confirmation window. */
  .shade { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.18); }
  .confirm { left: 207px; top: 26px; width: 610px; height: 668px; }
  .confirm .body { padding: 14px 20px 0; }
  .section-title { font-weight: 600; margin: 10px 0 6px; }
  .card { background: #fff; border: 1px solid var(--separator); border-radius: 9px; padding: 12px 14px; }
  .field {
    height: 28px; border-radius: 6px; border: 1px solid rgba(0, 0, 0, 0.14);
    display: flex; align-items: center; padding: 0 9px; background: #fff;
    white-space: nowrap; overflow: hidden;
  }
  .field.focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91, 108, 240, 0.25); }
  .muted { color: var(--text-tertiary); }
  .disclosure { margin-top: 9px; color: var(--text); }
  .resource-head { display: flex; align-items: center; gap: 10px; }
  .resource {
    margin-top: 10px; display: flex; gap: 12px; align-items: center;
    padding: 8px 10px; border-radius: 8px; background: var(--accent-soft);
  }
  .tile {
    width: 34px; height: 38px; border-radius: 6px; background: #fff;
    display: grid; place-items: center; color: var(--accent); font-size: 10px; font-weight: 700;
    box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12);
  }
  .grid { display: grid; grid-template-columns: 170px 1fr; row-gap: 9px; align-items: center; }
  .grid .label { color: var(--text-secondary); }
  .select { justify-content: space-between; }
  .select::after { content: "⌃"; transform: rotate(180deg); color: var(--accent); font-size: 11px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 11px; }
  .check i { width: 16px; height: 16px; border-radius: 4px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 11px; font-style: normal; }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 58px;
    border-top: 1px solid var(--separator);
    display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 0 20px;
  }
  .footer .btn { height: 30px; padding: 0 16px; }

  /* macOS notification banner after submission. */
  .banner {
    position: absolute; right: 18px; top: 18px; width: 330px;
    display: flex; gap: 10px; align-items: center;
    padding: 11px 13px; border-radius: 14px;
    background: rgba(248, 248, 250, 0.96);
    box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 10px 28px rgba(0, 0, 0, 0.18);
  }
  .banner .icon { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .banner .title { font-weight: 600; }
  .banner .sub { color: var(--text-secondary); font-size: 12px; }
</style>
</head>
<body>
<div class="stage">
  <div class="page">
    <h1>Sintel — trailer</h1>
    <div class="video">
      <div class="controls">
        <span>▶</span><span>0:12 / 0:52</span>
        <span class="track"><i></i></span>
        <svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><path d="M1 5h3l4-3.5v11L4 9H1z" fill="#fff"/><path d="M11 4.2a4 4 0 0 1 0 5.6M13 2.4a6.5 6.5 0 0 1 0 9.2" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9" fill="none" stroke="#fff" stroke-width="1.4"/></svg><span>⋮</span>
      </div>
    </div>
    <div class="caption"><u>Sintel</u> · Blender Foundation</div>
  </div>

  <div class="fab" id="fab">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5v7M3.8 5.6 7 8.8l3.2-3.2M2 12.3h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="panel" id="panel">
    <header>
      <span data-t="panelTitle"></span><span class="count">(1)</span>
      <span class="cookie" data-t="authorize"></span>
      <span class="close">✕</span>
    </header>
    <div class="row" id="row">
      <div>
        <div class="name">Sintel — trailer</div>
        <div class="meta"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1.5" width="10" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M3.5 1.5v9M8.5 1.5v9M1 4.5h2.5M1 7.5h2.5M8.5 4.5H11M8.5 7.5H11" stroke="currentColor" stroke-width="1"/></svg> <span>MP4 · 4.4 MB · 00:52</span></div>
      </div>
      <span class="chevron">›</span>
    </div>
  </div>
  <div class="toast" id="toast" data-t="sent"></div>

  <div class="shade" id="shade"></div>
  <div class="mac-window confirm" id="confirm">
    <div class="mac-titlebar"><span class="lights"><i></i><i></i><i></i></span><span style="flex:1;text-align:center;margin-right:52px" data-t="windowTitle"></span></div>
    <div class="body">
      <div class="section-title" data-t="url"></div>
      <div class="card">
        <div class="field">https://media.w3.org/2010/05/sintel/trailer.mp4</div>
        <div class="disclosure">› <span data-t="advanced"></span></div>
      </div>
      <div class="section-title" data-t="resources"></div>
      <div class="card">
        <div class="resource-head">
          <span class="btn primary">⌕ <span data-t="find"></span></span>
          <span class="muted" data-t="found"></span>
        </div>
        <div class="resource">
          <div class="tile">MP4</div>
          <div>
            <div><b>4.4 MB</b> <span class="muted" style="font-size:11px" data-t="direct"></span></div>
            <div class="muted" style="font-size:12px" data-t="duration"></div>
          </div>
        </div>
      </div>
      <div class="section-title" data-t="options"></div>
      <div class="card">
        <div class="grid">
          <span class="label" data-t="category"></span><span class="field select" data-t="auto"></span>
          <span class="label" data-t="saveTo"></span>
          <span style="display:flex;justify-content:space-between;align-items:center"><span class="muted">~/Downloads</span><span class="btn" data-t="choose"></span></span>
          <span class="label" data-t="fileName"></span><span class="field" id="filename">Sintel — trailer.mp4</span>
          <span class="label" data-t="parallel"></span><span>8 ⇕</span>
          <span class="label" data-t="priority"></span><span class="field select" data-t="normal"></span>
          <span class="label" data-t="sha"></span><span class="field muted" data-t="optional"></span>
        </div>
        <div class="check"><i>✓</i><span data-t="startNow"></span></div>
      </div>
    </div>
    <div class="footer">
      <span class="btn" data-t="cancel"></span>
      <span class="btn primary" id="start" data-t="start"></span>
    </div>
  </div>

  <div class="banner" id="banner">
    <div class="icon">↓</div>
    <div>
      <div class="title">MacIDM</div>
      <div class="sub"><span data-t="started"></span> · Sintel — trailer.mp4</div>
    </div>
  </div>
</div>

<script type="module">
import { applyStrings, cursorPath, drawCursor, easeOut, registerScene, span } from "./demo-kit.js";

// Strings mirror BrowserExtension/chrome/src/shared/locale-*.js (overlay.*)
// and Resources/Localization (the confirmation window).
applyStrings({
  panelTitle: { en: "Downloadable content", zh: "可下载内容" },
  authorize: { en: "Click to authorize site cookies", zh: "点击授权站点Cookies" },
  sent: { en: "Sent to MacIDM", zh: "已发送给 MacIDM" },
  windowTitle: { en: "New Download Task", zh: "新建下载任务" },
  url: { en: "URL", zh: "地址" },
  advanced: { en: "Advanced options", zh: "高级选项" },
  resources: { en: "Resources", zh: "资源" },
  find: { en: "Find Resources", zh: "寻找资源" },
  found: { en: "Resources found: 1", zh: "已找到 1 个资源" },
  direct: { en: "Direct link", zh: "直链" },
  duration: { en: "Duration 00:52", zh: "时长 00:52" },
  options: { en: "Download options", zh: "下载选项" },
  category: { en: "Category", zh: "分类" },
  auto: { en: "Auto-detect", zh: "自动判断" },
  saveTo: { en: "Save to", zh: "保存至" },
  choose: { en: "Choose…", zh: "选择…" },
  fileName: { en: "File name", zh: "文件名" },
  parallel: { en: "Max parallel requests", zh: "最大并行请求数" },
  priority: { en: "Queue priority", zh: "队列优先级" },
  normal: { en: "Normal", zh: "普通" },
  sha: { en: "Expected SHA-256", zh: "预期 SHA-256" },
  optional: { en: "Optional", zh: "可选" },
  startNow: { en: "Start downloading immediately", zh: "立即开始下载" },
  cancel: { en: "Cancel", zh: "取消" },
  start: { en: "Start Download", zh: "开始下载" },
  started: { en: "Download started", zh: "已开始下载" },
});

const $ = (id) => document.getElementById(id);
const fab = $("fab"), panel = $("panel"), row = $("row"), toast = $("toast");
const shade = $("shade"), confirmWindow = $("confirm"), start = $("start");
const filename = $("filename"), banner = $("banner");

const cursorKeys = [
  { t: 0.0, x: 470, y: 330 },
  { t: 0.6, x: 470, y: 330 },
  { t: 1.6, x: 934, y: 60 },
  { t: 2.4, x: 934, y: 60 },
  { t: 3.2, x: 790, y: 132 },
  { t: 5.0, x: 790, y: 132 },
  { t: 5.8, x: 610, y: 476 },
  { t: 7.0, x: 610, y: 476 },
  { t: 7.9, x: 736, y: 667 },
  { t: 12.0, x: 736, y: 667 },
];
const clicks = [1.8, 3.4, 8.3];

function show(node, amount, lift = 0) {
  node.style.opacity = String(amount);
  node.style.transform = lift ? `translateY(${(1 - amount) * lift}px)` : "";
  node.style.visibility = amount > 0.001 ? "visible" : "hidden";
}

function render(t) {
  fab.classList.toggle("hover", t > 1.5 && t < 4.2);

  // Panel opens on the button click and stays until the window appears.
  const panelIn = easeOut(span(t, 1.85, 2.15)) * (1 - span(t, 4.2, 4.5));
  show(panel, panelIn, -6);
  row.classList.toggle("hover", t > 3.0 && t < 4.3);
  show(toast, span(t, 3.5, 3.7) * (1 - span(t, 4.3, 4.5)));

  // The App's confirmation window comes forward, then closes on submit.
  const windowIn = easeOut(span(t, 4.4, 4.85)) * (1 - span(t, 8.6, 8.95));
  show(shade, windowIn);
  show(confirmWindow, windowIn, 18);
  filename.classList.toggle("focus", t > 6.0 && t < 7.4);
  start.classList.toggle("pressed", t > 8.25 && t < 8.55);

  // Notification banner after submission, faded out before the loop.
  show(banner, easeOut(span(t, 9.1, 9.45)) * (1 - span(t, 11.3, 11.7)), -14);

  const cursorVisible = !(t > 4.3 && t < 5.0);
  drawCursor(cursorPath(cursorKeys, t), t, clicks, cursorVisible && t < 9.0);
}

registerScene({ duration: 12, fps: 10, width: 1024, height: 720, render });
</script>
</body>
</html>
